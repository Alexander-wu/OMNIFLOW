seed: 42
output_dir: outputs

data:
  benchmark: turbulence2d
  data_root: data
  use_synthetic_if_missing: false
  sequence_length: 100
  height: 128
  width: 128
  channels: 2
  train_steps: 1
  test_steps: 99
  samples: 16

nes:
  type: perturbative_persistence
  ensemble_k: 8
  perturbation_lambda: 0.02

symbolic:
  topk_regions: 5

critic:
  divergence_threshold: 0.15
  energy_tolerance: 0.25

rag:
  top_k: 3
  knowledge:
    kphy:
      - "Mass conservation in incompressible flow requires divergence close to zero."
    kprot:
      - "If uncertainty exceeds threshold, trigger active probing."
    khist:
      - "Historical analogs can guide cautious decision-making."

agent:
  uncertainty_threshold: 0.10
  enable_counterfactual: true

train:
  enabled: false
  epochs: 20
  batch_size: 4
  learning_rate: 0.0001

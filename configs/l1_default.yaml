seed: 42
output_dir: outputs

data:
  benchmark: turbulence2d
  use_synthetic_if_missing: true
  sequence_length: 100
  height: 128
  width: 128
  channels: 2
  train_steps: 1
  test_steps: 99
  samples: 16

nes:
  type: perturbative_persistence
  ensemble_k: 8
  perturbation_lambda: 0.02

symbolic:
  topk_regions: 5

critic:
  divergence_threshold: 0.15
  energy_tolerance: 0.25

rag:
  top_k: 3
  knowledge:
    kphy:
      - "Mass conservation in incompressible flow requires divergence close to zero."
      - "Vorticity transport balances advection, stretching, and diffusion."
    kprot:
      - "If uncertainty exceeds threshold, trigger active probing and produce caution flag."
      - "When hazard thresholds are exceeded, emit actionable recommendations."
    khist:
      - "Historical ocean heatwaves exhibit persistence under weak atmospheric cooling."
      - "Regional eddy amplification correlates with elevated forecast uncertainty."

agent:
  uncertainty_threshold: 0.10
  enable_counterfactual: true
